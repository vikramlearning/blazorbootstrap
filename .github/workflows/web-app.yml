name: WebApp (Blazor Server)

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      prod_release:
        description: 'Do you want to release to production?'
        required: true
        default: false
        type: boolean

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 11.0.x
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '11.0.x'

      - name: Build
        run: dotnet build ./BlazorBootstrap.Demo.Server/BlazorBootstrap.Demo.Server.csproj --configuration Release

      - name: Publish
        run: dotnet publish ./BlazorBootstrap.Demo.Server/BlazorBootstrap.Demo.Server.csproj -c Release -o "${{env.DOTNET_ROOT}}/myapp"

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{env.DOTNET_ROOT}}/myapp

  deploy:
    runs-on: windows-latest
    if:  ${{ inputs.prod_release }} 
    needs: build
    environment:
      name: 'Production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app

      # clean: true empties wwwroot before extracting, so no file from an earlier release survives. A stale static
      # asset makes MapStaticAssets answer 500, because its size no longer matches the endpoints manifest.
      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'blazorbootstrap'
          slot-name: 'Production'
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_1F484B42E8E9491C82F21EED2A6E2C15 }}
          package: .
          type: zip
          clean: true
          restart: true
